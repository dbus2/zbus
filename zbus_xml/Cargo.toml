[package]
name = "zbus_xml"
version = "6.0.0"
authors = ["Zeeshan Ali Khan <zeeshanak@gnome.org>"]
edition = { workspace = true }
rust-version = { workspace = true }

description = "API to handle D-Bus introspection XML"
repository = { workspace = true }
keywords = ["D-Bus", "DBus", "IPC", "XML"]
license = { workspace = true }
categories = ["parsing"]
readme = "README.md"

[dependencies]
zbus = { path = "../zbus", version = "6.0.0", default-features = false }
winnow.workspace = true

[dev-dependencies]
doc-comment.workspace = true
criterion.workspace = true

[lib]
bench = false

# Each bench target is measured on CodSpeed by one of the two jobs of
# `.github/workflows/bench.yml`, which lists it: by CPU simulation, or by the clock.
[[bench]]
name = "benchmarks"
harness = false

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
    "aarch64-linux-android",
]

[lints]
workspace = true
